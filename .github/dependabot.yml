version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      test-tooling:
        patterns: ["vitest", "@vitejs/*", "jsdom", "@testing-library/*", "@playwright/test"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ESLint 10 is blocked until eslint-config-next's plugins support it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Keep in step with the Node runtime major (.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
