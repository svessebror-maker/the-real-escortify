# nginx site for the web app. Install with deploy/setup-server.sh.
# Replace `server_name _;` with your domain, then run: sudo certbot --nginx -d <domain>
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    # Android test build (optional), copied here by deploy/publish-android.sh.
    location = /downloads/letsseeeify.apk {
        alias /var/www/letsseeeify/downloads/letsseeeify.apk;
        types { }
        default_type application/vnd.android.package-archive;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
